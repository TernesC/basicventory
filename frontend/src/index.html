<!doctype html>
<html lang="pt-BR">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Inventário · Gestão de Equipamentos</title>
  <base href="/" />
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 24 24'%3E%3Crect width='24' height='24' rx='6' fill='%232563eb'/%3E%3Cpath d='M6 8.5 12 5.5l6 3v7l-6 3-6-3v-7Z' fill='none' stroke='white' stroke-width='1.6' stroke-linejoin='round'/%3E%3Cpath d='M6 8.5 12 11.5l6-3M12 11.5v7' fill='none' stroke='white' stroke-width='1.6' stroke-linejoin='round'/%3E%3C/svg%3E" />
  <script>
    // Aplica o tema salvo antes da pintura (evita flash do tema claro).
    try {
      var t = JSON.parse(localStorage.getItem("inventario.tema") || "null");
      if (t && t.nome) {
        document.documentElement.setAttribute("data-theme", t.nome);
        if (t.nome === "custom" && t.custom) {
          var r = document.documentElement.style;
          if (t.custom.brand) r.setProperty("--brand", t.custom.brand);
          if (t.custom.bg) r.setProperty("--bg", t.custom.bg);
          if (t.custom.surface) r.setProperty("--surface", t.custom.surface);
          if (t.custom.sidebar) r.setProperty("--sidebar", t.custom.sidebar);
        }
      }
    } catch (e) { /* tema padrão */ }
  </script>
</head>
<body>
  <app-root></app-root>
</body>
</html>
